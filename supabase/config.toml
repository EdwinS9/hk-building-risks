# Supabase local + linked-project configuration.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "hk-building-risks"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Per-request page cap. The frontend paginates anyway; this just sets the
# ceiling so a single request can pull a large page.
max_rows = 10000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
# Update these to your deployed origin before going to production.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# INVITE-ONLY: open sign-up is disabled. Admins create users from the
# Supabase dashboard (Authentication → Users → Invite user).
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1m"

# Disable any external OAuth providers explicitly (Google etc. off by default).
[auth.external.google]
enabled = false

[edge_runtime]
enabled = false
