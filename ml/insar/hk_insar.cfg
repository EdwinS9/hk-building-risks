########################################################################
# smallbaselineApp.cfg  --  HK Building Risks InSAR (HyP3 / Sentinel-1 ascending)
#
# Single ascending track, burst 021606 / IW3 / VV / INT80 (117 unclipped HyP3 pairs).
# Data are already geo-coded by HyP3 (X_FIRST set) in EPSG:32649 (UTM zone 49N, 80 m px),
# so the geocode step is auto-skipped and load_data writes inputs/ifgramStack.h5 +
# inputs/geometryGeo.h5 in the (projected UTM) geo grid. lalo keys below are lat,lon and
# are converted internally.
#
# Only keys verified against the authoritative MintPy defaults cfg + prep_hyp3.py are used.
# Dropped as invalid: mintpy.reference.maxCoherence AND mintpy.reference.method
#                     (NEITHER key exists; 'maxCoherence' is not a valid value anywhere).
#                     mintpy.velocity.*  (replaced by mintpy.timeFunc.*).
########################################################################


########## 1. Load Data (HyP3 reader)
## Globs use */ to match exactly one folder per interferogram pair (the .zip files are
## NOT matched because */ requires a directory). Suffixes are the UNCLIPPED HyP3 names
## (NOT the *_clip.tif suffixes used by the official tutorial); verified 117/117 on disk.
mintpy.load.processor        = hyp3
##---------interferogram datasets:
mintpy.load.unwFile          = /home/edwin/projects/hk-building-risks/insar/products/*/*_unw_phase.tif
mintpy.load.corFile          = /home/edwin/projects/hk-building-risks/insar/products/*/*_corr.tif
mintpy.load.connCompFile     = /home/edwin/projects/hk-building-risks/insar/products/*/*_conncomp.tif
##---------geometry datasets:
mintpy.load.demFile          = /home/edwin/projects/hk-building-risks/insar/products/*/*_dem.tif
mintpy.load.incAngleFile     = /home/edwin/projects/hk-building-risks/insar/products/*/*_lv_theta.tif
mintpy.load.azAngleFile      = /home/edwin/projects/hk-building-risks/insar/products/*/*_lv_phi.tif
mintpy.load.waterMaskFile    = /home/edwin/projects/hk-building-risks/insar/products/*/*_water_mask.tif
## NOTE: incAngleFile=lv_theta / azAngleFile=lv_phi is the documented HyP3->MintPy mapping
## (MintPy handles the conversion at load). CAUTION: HyP3 lv_theta is the LOOK-VECTOR
## ELEVATION angle from the HORIZONTAL, in RADIANS (~0.77-0.84 rad here), NOT the incidence
## angle from vertical. Incidence-from-vertical = pi/2 - lv_theta. Any downstream
## v_vertical = v_LOS / cos(incidence) MUST convert accordingly (and use radians, not deg).
## Do NOT use los_rdr (a 2-band LOS unit vector the hyp3 loader does not read; no load key).


########## 2. Subset (AOI clip)
## Restrict the stack to the harbour-front building AOI (and the bedrock reference zone)
## BEFORE referencing/inversion: trims open water and the far footprint margins, speeds
## the run, and constrains coherence-based steps to the area of interest.
## Order: S, N, W, E  (lat_min, lat_max, lon_min, lon_max). Reference pin + all fallbacks
## verified inside this box and inside the burst footprint.
## Subset = common-overlap box of all 117 HyP3 products (they have slightly different
## geocoded extents). Cropping all 117 to this shared grid lets the FULL network load;
## subset=no instead drops 83 mismatched pairs and keeps only 34. Box covers 85% of buildings.
## (Harbour-core subset was 22.18:22.42,114.08:114.32 -> only 24.2% coverage.)
mintpy.subset.lalo           = 22.1354:22.4600,113.7440:114.6250


########## 3. Modify Network (coherence-based pair selection)
mintpy.network.coherenceBased   = yes
mintpy.network.minCoherence     = 0.4
mintpy.network.keepMinSpanTree  = yes
mintpy.network.tempBaseMax      = no
mintpy.network.connNumMax       = no


########## 4. Reference Point (zero-motion datum)
## Manual pin on confirmed Kowloon Granite bedrock: Checkerboard Hill / Kowloon Tsai Hill,
## ~98 m, dense urban PS, centrally located, away from West Kowloon / Kai Tak / TKO /
## Tung Chung reclamation. Verified inside the burst footprint AND inside the AOI subset
## (UTM 828210, 2474098 within X[782000,877280] Y[2450000,2489280]; geology = Kowloon
## Granite, confirmed). MintPy snaps to the nearest valid coherent pixel; minCoherence +
## maskFile gate the snap. lalo order is lat,lon.
mintpy.reference.lalo           = 22.3415,114.1862
mintpy.reference.coherenceFile  = avgSpatialCoh.h5
mintpy.reference.minCoherence   = 0.85
mintpy.reference.maskFile       = maskConnComp.h5
## FALLBACK if that pixel decorrelates: there is NO mintpy.reference.method key in MintPy.
## To use AUTO selection, simply COMMENT OUT the reference.lalo line above; MintPy auto mode
## then picks the highest-coherence valid pixel, gated by reference.minCoherence +
## reference.maskFile (maskConnComp.h5). After an auto pick, cross-check it lands on granite,
## not reclamation; if not, restore a manual pin, stepping through:
##   22.3380,114.1790 -> 22.3593,114.1593 -> 22.2759,114.1456  (all verified in-footprint).


########## 5. Unwrap Error Correction
mintpy.unwrapError.method       = bridging


########## 6. Network Inversion (SBAS)
mintpy.networkInversion.weightFunc     = var
mintpy.networkInversion.maskDataset    = coherence
mintpy.networkInversion.maskThreshold  = 0.4
mintpy.networkInversion.minTempCoh     = 0.7
mintpy.networkInversion.minNumPixel    = 100
## NOTE: maskDataset=coherence + maskThreshold=0.4 mask per-ifgram pixels below coherence
## 0.4 during inversion. Both keys exist and are in range on current MintPy, so they will
## NOT error; minTempCoh=0.7 remains the load-bearing temporal-coherence reliability gate.


########## 7. Tropospheric Delay (offline, no external account)
## height_correlation removes the dominant stratified (topography-correlated) delay using
## the data itself; runs fully offline (no CDS / ~/.cdsapirc). HK relief (Kowloon hills,
## HK Island peaks) makes this term real. Switch to pyaps + ERA5 only if a CDS account is set up.
mintpy.troposphericDelay.method     = height_correlation
mintpy.troposphericDelay.polyOrder  = 1


########## 8. Phase Deramping
mintpy.deramp                       = linear


########## 9. Topographic Residual (DEM error) Correction
mintpy.topographicResidual                  = yes
mintpy.topographicResidual.pixelwiseGeometry = yes


########## 10. Velocity / Time Function
## Correct namespace is timeFunc.* (there is NO mintpy.velocity.* namespace).
## Linear (polynomial = 1) velocity over the 2-yr stack; timeseries2velocity -> velocity.h5 (m/yr).
mintpy.timeFunc.polynomial          = 1


########## 11. Compute / Save
mintpy.compute.maxMemory            = 8
mintpy.save.hdfEos5                 = no
